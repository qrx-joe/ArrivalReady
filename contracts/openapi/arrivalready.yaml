# Arrival Ready API contract — v1 (OpenAPI 3.1)
#
# 唯一事实源（docs/03 §4.1 / ADR-0001）。Go API 与 Next.js Web 均以本文件为准；
# 修改规则：additive-first，破坏性变更 = /api/v2 或显式废弃窗口。
# 本契约落实：R-03（run 冻结标准版本）、R-05（三条状态轴分离）、
# R-07（输入快照 + parent_run_id）、TECH_SPEC §9/§11（幂等）、§9.5（RFC 9457 错误）。
openapi: 3.1.0
info:
  title: Arrival Ready API
  version: 1.0.0
  description: |
    供给侧国际访客接待准备度验收系统 API。

    约定：
    - 全部主键 UUIDv7；时间 UTC RFC 3339；locale BCP-47。
    - 响应统一 `{data, meta.request_id}` 包裹；错误为 RFC 9457 Problem Details。
    - 写操作幂等：创建 Audit、upload complete、retest 必须携带 `Idempotency-Key`；
      相同 key + 不同 payload = 409。
    - 三条状态轴相互独立（见 contracts/state-machines.md）：
      run/workflow 状态、finding.assessment_status、finding.review_status。
servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发（B04 compose）
security:
  - bearerAuth: []
tags:
  - name: projects
  - name: evidence
  - name: audits
  - name: findings

paths:
  /projects:
    post:
      tags: [projects]
      summary: 创建验收项目（P0-1）
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvelope" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [projects]
      summary: 项目列表（cursor 分页）
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectListEnvelope" }

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      summary: 项目详情
      operationId: getProject
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      summary: 更新项目（乐观并发，version 不匹配返回 409）
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvelope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/evidence/upload-url:
    post:
      tags: [evidence]
      summary: 申请私有上传签名 URL（服务端生成随机 object key）
      operationId: createEvidenceUploadUrl
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlInput" }
      responses:
        "201":
          description: 已签发
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlEnvelope" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /projects/{projectId}/evidence:
    post:
      tags: [evidence]
      summary: upload complete（幂等；校验对象实际大小/Content-Type/magic bytes/hash 后才 READY）
      operationId: completeEvidenceUpload
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceCompleteInput" }
      responses:
        "201":
          description: 校验通过，Evidence READY
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceEnvelope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [evidence]
      summary: 项目证据列表
      operationId: listEvidence
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceListEnvelope" }

  /evidence/{evidenceId}:
    parameters:
      - $ref: "#/components/parameters/EvidenceId"
    get:
      tags: [evidence]
      summary: 证据详情（含短期私有下载签名 URL）
      operationId: getEvidence
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: 证据已按保留策略删除；返回占位说明与保留的 hash/元数据（R-16）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [evidence]
      summary: 软删除证据（占位保留；被 run 引用的材料清理受保护）
      operationId: deleteEvidence
      responses:
        "204": { description: 已删除（软删除） }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /projects/{projectId}/audits:
    post:
      tags: [audits]
      summary: 创建 AuditRun（幂等；冻结标准版本与证据输入清单）
      operationId: createAudit
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditCreateInput" }
      responses:
        "202":
          description: 已受理（异步 job）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditRunEnvelope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [audits]
      summary: AuditRun 列表
      operationId: listAudits
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditRunListEnvelope" }

  /audits/{auditId}:
    parameters:
      - $ref: "#/components/parameters/AuditId"
    get:
      tags: [audits]
      summary: AuditRun 详情（含冻结的标准版本/hash 与评分快照）
      operationId: getAudit
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditRunEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /audits/{auditId}/cancel:
    post:
      tags: [audits]
      summary: 取消运行中的 Audit（幂等；晚到的 job 响应将被丢弃）
      operationId: cancelAudit
      responses:
        "202":
          description: 取消受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditRunEnvelope" }
        "409":
          description: 终态（COMPLETED/FAILED/CANCELLED）不可取消
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }

  /audits/{auditId}/retest:
    post:
      tags: [audits]
      summary: 创建复测：指向 parent 的新 AuditRun（绝不修改旧 run；幂等）
      operationId: retestAudit
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetestInput" }
      responses:
        "202":
          description: 新 run 已受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditRunEnvelope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "404": { $ref: "#/components/responses/NotFound" }

  /audits/{auditId}/findings:
    get:
      tags: [findings]
      summary: Finding 列表（含 assessment/review 两轴状态）
      operationId: listFindings
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingListEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /findings/{findingId}:
    parameters:
      - $ref: "#/components/parameters/FindingId"
    get:
      tags: [findings]
      summary: Finding 详情（证据引用 + locator + 规则 + 置信度 + 人审状态）
      operationId: getFinding
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /findings/{findingId}/reviews:
    post:
      tags: [findings]
      summary: 提交人审决定（confirm/reject/edit/na；edit 保留原始候选；乐观并发）
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "201":
          description: 已记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingEnvelope" }
        "409":
          description: 版本冲突（旧页面提交）或终态不可再审
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /findings/{findingId}/task:
    patch:
      tags: [findings]
      summary: 更新整改任务状态（显式状态机，非法迁移 422；每次迁移记录 actor/原因/版本）
      operationId: updateFixTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FixTaskPatch" }
      responses:
        "200":
          description: 已迁移
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixTaskEnvelope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: 非法状态迁移（见 contracts/state-machines.md）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC 签发的 JWT；后端校验 issuer/audience/expiry/signature（TECH_SPEC §12）。

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuditId:
      name: auditId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FindingId:
      name: findingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 255 }
      description: 组织 + 操作作用域的幂等键（TECH_SPEC §11）。
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  responses:
    NotFound:
      description: 资源不存在（或无权访问——不区分以避免枚举探测）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: 幂等冲突 / 版本冲突 / 非法终态操作
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unprocessable:
      description: 校验失败（枚举非法、缺字段、迁移非法等）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details（TECH_SPEC §9.5）
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        request_id: { type: string }
        errors:
          type: array
          description: 字段级错误明细（422 时）
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }
        next_cursor: { type: [string, "null"] }

    ProjectInput:
      type: object
      required: [name, entity_type, target_locale]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        entity_type: { enum: [restaurant, retail, museum, venue, other] }
        address_note: { type: string, maxLength: 500 }
        target_locale: { type: string, pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$" }
        scope_note: { type: string, maxLength: 2000, description: 本次验收范围说明（自由文本） }
    ProjectPatch:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1, description: 乐观并发版本号 }
        name: { type: string, minLength: 1, maxLength: 200 }
        address_note: { type: string, maxLength: 500 }
        scope_note: { type: string, maxLength: 2000 }
        status: { enum: [active, archived], description: 归档为软删除；历史 Audit 保留（US-01） }
    Project:
      type: object
      required: [id, organization_id, name, entity_type, target_locale, status, version, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        entity_type: { enum: [restaurant, retail, museum, venue, other] }
        address_note: { type: string }
        target_locale: { type: string }
        scope_note: { type: string }
        status: { enum: [active, archived] }
        version: { type: integer }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    ProjectEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Project" }
        meta: { $ref: "#/components/schemas/Meta" }
    ProjectListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        meta: { $ref: "#/components/schemas/Meta" }

    UploadUrlInput:
      type: object
      required: [evidence_type, mime_type, size_bytes, journey_stage]
      properties:
        evidence_type: { enum: [image, pdf, url, text] }
        mime_type: { type: string }
        size_bytes: { type: integer, minimum: 1, maximum: 52428800, description: 上限按类型在服务端再校验；此处为全局硬顶 50MiB }
        journey_stage: { enum: [discover, understand, decide, act, pay, recover, remember, unspecified] }
        source_uri_note: { type: string, maxLength: 2048, description: 原始来源（URL 登记或原文件名，仅作元数据） }
    UploadUrlEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [evidence_id, upload_url, object_key, expires_at]
          properties:
            evidence_id: { type: string, format: uuid }
            upload_url: { type: string, format: uri, description: 私有桶签名 PUT URL，短时效 }
            object_key: { type: string, description: 服务端生成的随机 key；客户端不得自选 }
            expires_at: { type: string, format: date-time }
        meta: { $ref: "#/components/schemas/Meta" }
    EvidenceCompleteInput:
      type: object
      required: [evidence_id, object_key, size_bytes, sha256]
      properties:
        evidence_id: { type: string, format: uuid }
        object_key: { type: string }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        captured_at: { type: string, format: date-time }
    Evidence:
      type: object
      required: [id, project_id, type, processing_status, sha256, journey_stage, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        type: { enum: [image, pdf, url, text] }
        source_uri_note: { type: string }
        object_key: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        mime_type: { type: string }
        journey_stage: { enum: [discover, understand, decide, act, pay, recover, remember, unspecified] }
        processing_status: { enum: [PENDING_UPLOAD, VALIDATING, READY, QUARANTINED, DELETED] }
        quarantine_reason: { type: [string, "null"] }
        download_url: { type: [string, "null"], format: uri, description: 短时效私有签名 URL；仅在状态允许时返回 }
        created_at: { type: string, format: date-time }
    EvidenceEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Evidence" }
        meta: { $ref: "#/components/schemas/Meta" }
    EvidenceListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
        meta: { $ref: "#/components/schemas/Meta" }

    AuditCreateInput:
      type: object
      required: [evidence_ids]
      properties:
        evidence_ids:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
          description: 本次 run 的证据清单——创建即冻结为输入快照（R-07）；此后新增证据属于下一个 run。
        standard:
          type: object
          description: 缺省绑定当前 active 标准；显式指定用于复现与测试。
          properties:
            code: { const: IRRS }
            version: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
    AuditRun:
      type: object
      required: [id, project_id, status, standard, evidence_manifest, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        parent_run_id: { type: [string, "null"], format: uuid }
        status:
          enum: [DRAFT, QUEUED, INGESTING, ANALYZING, REVIEW_REQUIRED, COMPLETED, FAILED, CANCELLED]
          description: workflow 状态轴（contracts/state-machines.md）；REVIEW_REQUIRED 前可更新，COMPLETED 后只读。
        status_reason: { type: [string, "null"], description: FAILED/CANCELLED 的可诊断原因（不含敏感材料） }
        standard:
          type: object
          required: [code, version, rules_sha256]
          properties:
            code: { const: IRRS }
            version: { type: string }
            rules_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        evidence_manifest:
          type: array
          description: 输入快照：evidence_id + sha256（复测对齐与不可变性依据，R-07）
          items:
            type: object
            required: [evidence_id, sha256]
            properties:
              evidence_id: { type: string, format: uuid }
              sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        model_bundle_version: { type: [string, "null"] }
        prompt_bundle_version: { type: [string, "null"] }
        total_score: { type: [number, "null"], description: null = 部分评估/未完成（ADR-0002）；不由 AI 产生 }
        scoring:
          type: [object, "null"]
          description: finalize 时冻结（算法版本 + 维度权重 + 各维度分/覆盖率）
          properties:
            algorithm_version: { type: string }
            dimensions:
              type: array
              items:
                type: object
                required: [dimension, score, evaluated_weight, applicable_weight]
                properties:
                  dimension: { enum: [D1, D2, D3, D4, D5, D6, D7] }
                  score: { type: number }
                  evaluated_weight: { type: number }
                  applicable_weight: { type: number }
        is_comparable_with_parent: { type: [boolean, "null"], description: 复测可比较性（同标准/同范围/同 profile）；false 时 Diff 必须标注不可比较 }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    AuditRunEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/AuditRun" }
        meta: { $ref: "#/components/schemas/Meta" }
    AuditRunListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AuditRun" }
        meta: { $ref: "#/components/schemas/Meta" }
    RetestInput:
      type: object
      required: [evidence_ids]
      properties:
        evidence_ids:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
          description: 新证据清单——显式选择；绝不默认替换/重用旧 run 对象。
        carried_over_evidence_ids:
          type: array
          items: { type: string, format: uuid }
          description: 从父 run 显式保留的证据（随新快照重新登记，不共享可变性）。
        standard:
          type: object
          properties:
            code: { const: IRRS }
            version: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }

    Finding:
      type: object
      required: [id, audit_run_id, rule_id, assessment_status, severity, evidence_refs, confidence, review_status, task, created_at]
      properties:
        id: { type: string, format: uuid }
        audit_run_id: { type: string, format: uuid }
        rule_id: { type: string, pattern: "^IRRS-D[1-7]-[0-9]{3}$" }
        dimension: { enum: [D1, D2, D3, D4, D5, D6, D7] }
        assessment_status: { enum: [PASS, WARN, FAIL, UNKNOWN], description: 状态轴 1：AI 候选/修订后的检查结论 }
        severity: { enum: [S0, S1, S2, S3, Info] }
        title: { type: string }
        description: { type: string }
        observation: { type: string, description: observed_fact（证据里看到了什么） }
        reason: { type: string, description: inference（为何得出该状态） }
        recommended_fix: { type: [string, "null"] }
        evidence_refs:
          type: array
          items:
            type: object
            required: [evidence_id, locator]
            properties:
              evidence_id: { type: string, format: uuid }
              locator:
                type: object
                description: 归一化坐标（见 assessment-1.0 schema $defs.locator）；缩放/换分辨率不失效
                properties:
                  type: { enum: [bbox, page, quote, full] }
                  bbox:
                    type: object
                    properties:
                      x: { type: number, minimum: 0, maximum: 1 }
                      y: { type: number, minimum: 0, maximum: 1 }
                      w: { type: number, exclusiveMinimum: 0, maximum: 1 }
                      h: { type: number, exclusiveMinimum: 0, maximum: 1 }
                  page: { type: integer, minimum: 1 }
                  quote: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1, description: 排序提示，不参与算分 }
        ai_generated: { type: boolean }
        review_status: { enum: [UNREVIEWED, CONFIRMED, EDITED, REJECTED, NA], description: 状态轴 2：人审处置 }
        review:
          type: [object, "null"]
          properties:
            decision: { enum: [confirm, reject, edit, na] }
            note: { type: [string, "null"] }
            edited_fields: { type: [object, "null"], description: edit 时的修订值；原始候选始终保留在 original_candidate }
            reviewer_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
        original_candidate:
          type: [object, "null"]
          description: edit 后保留的 AI 原始候选（可追溯、可重放；R-05）
        effective_status: { enum: [PASS, WARN, FAIL, UNKNOWN], description: 评分实际采用的结论 = 候选经人审修订后的值（ADR-0002 §2.5） }
        task: { $ref: "#/components/schemas/FixTask" }
        created_at: { type: string, format: date-time }
    FindingEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Finding" }
        meta: { $ref: "#/components/schemas/Meta" }
    FindingListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        meta: { $ref: "#/components/schemas/Meta" }
    ReviewInput:
      type: object
      required: [decision, finding_version]
      properties:
        decision: { enum: [confirm, reject, edit, na] }
        finding_version: { type: integer, minimum: 1, description: 乐观并发；不匹配返回 409 }
        note: { type: string, maxLength: 2000 }
        edits:
          type: object
          description: decision=edit 时必填；可修订 assessment_status/severity/description/recommended_fix
          properties:
            assessment_status: { enum: [PASS, WARN, FAIL, UNKNOWN] }
            severity: { enum: [S0, S1, S2, S3, Info] }
            description: { type: string }
            recommended_fix: { type: string }
        na_reason:
          type: string
          description: decision=na 时必填（ADR-0002：N/A 必须留理由）

    FixTask:
      type: object
      required: [id, finding_id, workflow_status, version, created_at]
      properties:
        id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }
        workflow_status:
          enum: [OPEN, ACKNOWLEDGED, FIXING, READY_FOR_RETEST, RESOLVED, ACCEPTED_RISK, REOPENED]
          description: 状态轴 3：整改工作流（contracts/state-machines.md）；不覆盖历史判断
        owner_id: { type: [string, "null"], format: uuid }
        due_at: { type: [string, "null"], format: date-time }
        resolution_note: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
    FixTaskEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/FixTask" }
        meta: { $ref: "#/components/schemas/Meta" }
    FixTaskPatch:
      type: object
      required: [workflow_status, version]
      properties:
        workflow_status: { enum: [ACKNOWLEDGED, FIXING, READY_FOR_RETEST, RESOLVED, ACCEPTED_RISK, REOPENED] }
        version: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 2000, description: 每次迁移记录原因（审计） }
        resolution_note: { type: string, maxLength: 2000 }
        acceptance_risk_note:
          type: string
          description: 迁移到 ACCEPTED_RISK 时必填（有理由的风险接受 ≠ PASS）
