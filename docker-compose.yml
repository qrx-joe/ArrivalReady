# 本地开发基础设施（TECH_SPEC §23）。应用三端在宿主机运行（make api / ai / web），
# compose 只承载 PostgreSQL 与 MinIO。
# 安全边界：
#   - 这里只有本地开发凭据；真实凭据经部署环境注入（docs/03 §4.3）。
#   - MinIO 镜像暂用浮动 latest（本地 dev only）；首次部署前必须换成 digest pin
#     （docs/03 §8 禁止 latest 上生产）。
services:
  postgres:
    image: postgres:18
    container_name: arrivalready-postgres
    environment:
      POSTGRES_USER: arrival
      POSTGRES_PASSWORD: arrival_dev
      POSTGRES_DB: arrivalready
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arrival -d arrivalready"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: arrivalready-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arrival
      MINIO_ROOT_PASSWORD: arrival_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  miniodata:
