# 离线质量门禁：不依赖任何模型 key、数据库或外部服务（B04）。
# 付费的真实模型评测独立触发（B08/B15），普通 PR 不产生模型调用。
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    name: contracts (offline fixtures + openapi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation deps
        run: pip install pyyaml jsonschema openapi-spec-validator
      - name: IRRS rules schema + fixtures
        run: |
          python scripts/validate_rules.py --fixtures standards/irrs/0.1.0/fixtures
          python scripts/validate_rules.py standards/irrs/0.1.0/rules.yaml
      - name: Contracts fixtures + OpenAPI
        run: |
          python scripts/validate_contracts.py --fixtures contracts/fixtures
          python scripts/validate_contracts.py --openapi contracts/openapi/arrivalready.yaml
      - name: B08 offline eval fixtures (fake adapter, no provider key)
        run: python evals/runners/run_b08_fixtures.py

  api:
    name: api (go vet/test/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: arrival
          POSTGRES_PASSWORD: arrival_dev
          POSTGRES_DB: arrival_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arrival -d arrival_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://arrival:arrival_dev@localhost:5432/arrival_test?sslmode=disable
      MINIO_TEST_ENDPOINT: localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: Start MinIO (host process; container image healthcheck quirks avoided)
        run: |
          curl -sSL -o /tmp/minio https://dl.min.io/server/minio/release/linux-amd64/minio
          chmod +x /tmp/minio
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=arrival MINIO_ROOT_PASSWORD=arrival_dev_password /tmp/minio server /tmp/minio-data --address :9000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9000/minio/health/live
      - name: test (unit + integration against service postgres + host minio)
        run: go test -p 1 ./...
      - name: build
        run: go build ./...

  ai:
    name: ai (ruff/mypy/pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: sync (locked)
        run: uv sync --locked
      - name: ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy app
      - name: pytest
        run: uv run pytest -q

  web:
    name: web (biome/tsc/vitest/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install (locked)
        run: pnpm install --frozen-lockfile
      - name: biome
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: vitest
        run: pnpm test
      - name: build
        run: pnpm build
