# 离线质量门禁：不依赖任何模型 key、数据库或外部服务（B04）。
# 付费的真实模型评测独立触发（B08/B15），普通 PR 不产生模型调用。
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    name: contracts (offline fixtures + openapi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation deps
        run: pip install pyyaml jsonschema openapi-spec-validator
      - name: IRRS rules schema + fixtures
        run: |
          python scripts/validate_rules.py --fixtures standards/irrs/0.1.0/fixtures
          python scripts/validate_rules.py standards/irrs/0.1.0/rules.yaml
      - name: Contracts fixtures + OpenAPI
        run: |
          python scripts/validate_contracts.py --fixtures contracts/fixtures
          python scripts/validate_contracts.py --openapi contracts/openapi/arrivalready.yaml

  api:
    name: api (go vet/test/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...

  ai:
    name: ai (ruff/mypy/pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: sync (locked)
        run: uv sync --locked
      - name: ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy app
      - name: pytest
        run: uv run pytest -q

  web:
    name: web (biome/tsc/vitest/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install (locked)
        run: pnpm install --frozen-lockfile
      - name: biome
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: vitest
        run: pnpm test
      - name: build
        run: pnpm build
